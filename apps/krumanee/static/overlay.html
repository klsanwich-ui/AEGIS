<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        font-family: "Segoe UI", "Leelawadee UI", sans-serif;
      }
      #dot {
        position: absolute;
        width: 18px;
        height: 18px;
        margin-left: 14px;
        margin-top: 14px;
        border-radius: 50%;
        background: #4da3ff;
        box-shadow: 0 0 12px 6px rgba(77, 163, 255, 0.7);
        display: none;
      }
      #pointer {
        position: absolute;
        width: 28px;
        height: 28px;
        margin-left: -14px;
        margin-top: -14px;
        border-radius: 50%;
        border: 3px solid #ffd54a;
        box-shadow: 0 0 18px 4px rgba(255, 213, 74, 0.85);
        display: none;
        transition: left 0.45s ease, top 0.45s ease;
      }
      #label {
        position: absolute;
        transform: translate(18px, -12px);
        background: rgba(15, 18, 28, 0.88);
        color: #fff;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 13px;
        max-width: 240px;
        display: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="dot"></div>
    <div id="pointer"></div>
    <div id="label"></div>
    <script src="overlay.js"></script>
  </body>
</html>
